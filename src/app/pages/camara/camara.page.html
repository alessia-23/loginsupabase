<ion-header>
  <ion-toolbar>
    <ion-title>Cámara</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card class="camara-card">
    <ion-card-content>

      <h2>Mis fotografías</h2>

      <p>
        Toma una foto y guárdala localmente en la aplicación.
      </p>

      <ion-button expand="block" class="boton-camara" (click)="tomarFoto()">
        <ion-icon name="camera-outline" slot="start"></ion-icon>
        Tomar foto
      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-grid>
    <ion-row>

      <ion-col size="6" *ngFor="let photo of photoService.photos">

        <ion-img class="foto" [src]="photo.webviewPath">
        </ion-img>

      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
